<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>音ゲー プロトタイプ</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#0b0d14;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif;color:#e8eefc}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0d14ee;text-align:center;padding:20px}
button{font-size:18px;padding:12px 36px;border-radius:999px;border:0;background:#5ce1e6;color:#001;font-weight:700}
p,h2{margin:0}p{opacity:.8;font-size:14px;line-height:1.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="ov"><h2>RHYTHM PROTOTYPE</h2>
<p>PC: D F G H J K<br>スマホ: レーンを直接タップ<br>水色=タップ / 橙の帯=長押し / ピンク=フリック(スワイプ)<br>サビで画面が横向きに回る</p>
<button>START</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ov=document.getElementById('ov');
let W,H,D,s=1;
const rs=()=>{D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D};
addEventListener('resize',rs);rs();
const BPM=128,BT=60/BPM,N=6,LW=70,SP=620,BARS=32,KEYS='dfghjk',SC=[0,2,4,7,9,12];
const JN=['PERFECT','GREAT','GOOD','MISS'],JC=['#fff36b','#6bffb0','#6bb5ff','#ff6b8a'];
let ac,t0,nb,notes,score,combo,maxc,cnt,fx,ang,tg,msg,msgT,press,ptrs=new Map,run=0,last=0;
const now=()=>ac.currentTime-t0;
const th=t=>.25*Math.sin(t*1.3),bar=(t,x)=>230+x*Math.tan(th(t));

// ---- audio ----
function tone(f,t,d,type,v){const o=ac.createOscillator(),a=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(ac.destination);o.start(t);o.stop(t+d)}
function kick(t){const o=ac.createOscillator(),a=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);a.gain.setValueAtTime(.6,t);a.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(a).connect(ac.destination);o.start(t);o.stop(t+.2)}
// ヒット音: レーンごとにペンタトニックの音程 → 叩くとメロディになる
function hitSnd(l,q){const t=ac.currentTime,f=523*2**(SC[l]/12);tone(f,t,.12,'triangle',.28);tone(f*2,t,.05,'sine',.12);if(q==0)tone(f*3,t,.04,'sine',.08)}
function sched(){while(nb<BARS*4&&t0+nb*BT<ac.currentTime+.15){const t=t0+nb*BT,bar=nb>>2;kick(t);tone(55*2**([0,0,3,5][bar%4]/12),t,BT*.9,'sawtooth',.1);tone(8000,t+BT/2,.03,'square',.03);if(bar>=16)tone(220*2**(SC[(nb*3)%6]/12),t,.2,'square',.04);nb++}}

// ---- chart ----
function mk(){let sd=7;const r=()=>(sd=sd*16807%2147483647)/2147483647;const L=[],end=Array(N).fill(-1);let pl=2;
for(let i=16;i<BARS*8;i++){const t=i*BT/2,b=i>>3,ch=b>=16&&b<24;
if(i%2&&!(ch&&r()<.5))continue;if(r()<.25)continue;
const l=(pl+1+(r()*5|0))%N;if(t<=end[l]+.1)continue;
const x=r();let k='t',d=0;if(x<.14&&i%2==0){k='h';d=BT*(1+(r()*2|0))}else if(x<.28)k='f';
L.push({t,l,k,d,st:0});end[l]=t+d;pl=l;
if(ch&&r()<.25){const l2=(l+2+(r()*3|0))%N;if(l2!=l&&t>end[l2]+.1){L.push({t,l:l2,k:'t',d:0,st:0});end[l2]=t}}}
return L}

// ---- judge ----
const judge=d=>{d=Math.abs(d);return d<.045?0:d<.09?1:d<.13?2:3};
function addJ(q,l){if(q>2)combo=0;else{combo++;maxc=Math.max(maxc,combo);score+=[1000,700,400][q]+combo*2;hitSnd(l,q);fx.push({l,t:now(),c:JC[q]})}cnt[q]++;msg=q;msgT=now()}
function hit(n,T){n.st=n.k=='h'?1:2;n.q=judge(n.t-T);addJ(n.q,n.l)}
function down(l,id){press[l]++;const T=now();let b=null;
for(const n of notes)if(n.l==l&&n.st==0&&Math.abs(n.t-T)<.13&&(!b||n.t<b.t))b=n;
if(!b)return null;if(b.k=='f'&&id!='k')return b;hit(b,T);return null}

// ---- input ----
function laneAt(px,py){const dx=(px-W/2)/s,dy=(py-H/2)/s,c=Math.cos(ang),n=Math.sin(ang);const x=dx*c+dy*n;return Math.max(0,Math.min(N-1,Math.floor((x+210)/LW)))}
addEventListener('pointerdown',e=>{if(!run)return;const l=laneAt(e.clientX,e.clientY);ptrs.set(e.pointerId,{l,x:e.clientX,y:e.clientY,p:down(l,'p')})});
addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(p&&p.p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>22){if(p.p.st==0)hit(p.p,now());p.p=null}});
const up=e=>{const p=ptrs.get(e.pointerId);if(p){press[p.l]=Math.max(0,press[p.l]-1);ptrs.delete(e.pointerId)}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(!run||e.repeat)return;const l=KEYS.indexOf(e.key.toLowerCase());if(l>=0)down(l,'k')});
addEventListener('keyup',e=>{const l=KEYS.indexOf(e.key.toLowerCase());if(l>=0)press[l]=Math.max(0,press[l]-1)});
addEventListener('contextmenu',e=>e.preventDefault());

// ---- update / draw ----
function update(T,dt){
for(const n of notes){
if(n.st==0&&T>n.t+.13){n.st=3;addJ(3,n.l)}
else if(n.st==1){if(T>=n.t+n.d){n.st=2;score+=300;hitSnd(n.l,1)}else if(!press[n.l]&&T<n.t+n.d-.12){n.st=3;combo=0;msg=3;msgT=T}}}
const b=(T+1)/(BT*4)|0;const ch=b>=16&&b<24,P=Math.PI/2;tg=ch?P:b>=28?-P:0;
ang+=(tg-ang)*Math.min(1,dt*4)}
function draw(T){
g.setTransform(D,0,0,D,0,0);g.fillStyle='#0b0d14';g.fillRect(0,0,W,H);
const k=Math.abs(Math.sin(ang)),ls=W>H,vh=ls?460:740;s=Math.min(W/(440+(vh-440)*k),H/(vh-(vh-440)*k));
g.save();g.translate(W/2,H/2);g.scale(s,s);g.rotate(ang);g.translate(0,ls?-100:0);
for(let l=0;l<N;l++){g.fillStyle=press[l]>0?'#26405c':l%2?'#141a28':'#10151f';g.fillRect(-210+l*LW,-370,LW,740)}
g.strokeStyle='#2a3350';g.lineWidth=1;
for(let l=0;l<=N;l++){g.beginPath();g.moveTo(-210+l*LW,-370);g.lineTo(-210+l*LW,370);g.stroke()}

for(const n of notes){if(n.st>1)continue;const x=-210+n.l*LW,y=n.st==1?bar(T,x+LW/2):bar(n.t,x+LW/2)-(n.t-T)*SP;if(y<-400||y>420)continue;
if(n.k=='h'){const ye=bar(n.t+n.d,x+LW/2)-(n.t+n.d-T)*SP;g.fillStyle='#ffb84d88';g.fillRect(x+16,ye,LW-32,y-ye)}
g.fillStyle=n.k=='h'?'#ffb84d':n.k=='f'?'#ff6ec7':'#5ce1e6';
g.beginPath();g.roundRect(x+5,y-9,LW-10,18,6);g.fill();
if(n.k=='f'){g.fillStyle='#fff';g.beginPath();g.moveTo(x+LW/2,y-6);g.lineTo(x+LW/2+8,y+5);g.lineTo(x+LW/2-8,y+5);g.fill()}}
g.save();g.translate(0,230);g.rotate(th(T));g.shadowColor='#5ce1e6';g.shadowBlur=14;g.fillStyle='#e8fbff';g.fillRect(-214,-3,428,6);g.shadowBlur=0;
g.fillStyle='#8aa0b8';g.font='bold 16px system-ui';g.textAlign='center';
for(let l=0;l<N;l++)g.fillText(KEYS[l].toUpperCase(),-210+l*LW+LW/2,26);g.restore();
for(const f of fx){const a=(T-f.t)/.3;if(a<1){g.strokeStyle=f.c;g.globalAlpha=1-a;g.lineWidth=3;g.beginPath();g.arc(-210+f.l*LW+LW/2,bar(f.t,-210+f.l*LW+LW/2),10+a*34,0,7);g.stroke()}}
g.globalAlpha=1;fx=fx.filter(f=>T-f.t<.3);g.restore();
g.fillStyle='#5ce1e6';g.fillRect(0,0,W*Math.min(1,T/(BARS*4*BT)),3);
g.fillStyle='#fff';g.font='bold 20px system-ui';g.textAlign='left';g.fillText(String(score).padStart(7,'0'),16,32);
g.textAlign='center';
if(combo>1){g.font='bold 40px system-ui';g.fillText(combo,W/2,72)}
if(T-msgT<.5){g.fillStyle=JC[msg];g.font='bold 22px system-ui';g.fillText(JN[msg],W/2,102)}}
function loop(ts){if(!run)return;requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;const T=now();sched();update(T,dt);draw(T);
if(T>notes[notes.length-1].t+2)fin()}
function fin(){run=0;ov.style.display='flex';ov.innerHTML=`<h2>RESULT</h2><p>SCORE ${score}<br>MAX COMBO ${maxc}<br>${JN.map((j,i)=>j+' '+cnt[i]).join(' / ')}</p><button>RETRY</button>`}
function start(){if(!ac)ac=new AudioContext();ac.resume();notes=mk();score=combo=maxc=0;cnt=[0,0,0,0];fx=[];ang=tg=0;msg=0;msgT=-9;press=Array(N).fill(0);ptrs.clear();nb=0;t0=ac.currentTime+1.2;run=1;ov.style.display='none';requestAnimationFrame(loop)}
ov.onclick=e=>{if(e.target.tagName=='BUTTON')start()};
</script></body></html>
